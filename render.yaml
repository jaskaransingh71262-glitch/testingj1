services:
  - type: web
    name: ai-product-studio-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: WORKER_SECRET
        generateValue: true

  - type: static
    name: qwen-browser-ui
    rootDir: qwen-browser/web
    buildCommand: ""
    staticPublishPath: .
