name: Build and Deploy to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build production app
        run: npm run build

      - name: Verify production build
        run: test -f dist/index.html

      - name: Deploy dist to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e

          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN GitHub secret is not configured."
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf hf-space
          git clone "https://user:${HF_TOKEN}@huggingface.co/spaces/jaskaransingh123/ai-product-studio" hf-space

          find hf-space -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp -R dist/. hf-space/

          cat > hf-space/README.md <<'EOF'
---
title: AI Product Studio
emoji: 🎨
colorFrom: purple
colorTo: blue
sdk: static
app_file: index.html
pinned: false
---

# AI Product Studio

AI-powered product image creation studio.
EOF

          cd hf-space
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "Deploy production build from testingj1"
          git push origin HEAD:main
