name: Deploy AI Generation Engine

on:
  push:
    branches: [main]
    paths:
      - "ai-backend/**"
      - ".github/workflows/deploy-ai-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugging Face Hub
        run: python -m pip install -U huggingface_hub

      - name: Create or verify ZeroGPU Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token=os.environ["HF_TOKEN"]
          api=HfApi(token=token)
          repo="jaskaransingh123/ai-product-studio-engine"
          try:
              api.repo_info(repo, repo_type="space")
              print("Space already exists:", repo)
          except Exception:
              print("Creating ZeroGPU Space:", repo)
              api.create_repo(
                  repo_id=repo,
                  repo_type="space",
                  space_sdk="gradio",
                  space_hardware="zero-a10g",
                  private=False,
              )
          PY

      - name: Deploy engine files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              repo_id="jaskaransingh123/ai-product-studio-engine",
              repo_type="space",
              folder_path="ai-backend",
              commit_message="Deploy AI Product Studio generation engine",
          )
          print("Engine deployed.")
          PY

# deployment pipeline active
